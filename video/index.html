<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>International Class 2026 · Main Video</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=Geist:wght@400;500;600&family=Geist+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  /* Palet E2 UNIKAL Heritage */
  :root {
    --navy: #09153f; --navy2: #122a5e; --gold: #e9c546; --cream: #f6f1e6;
    --soft: #c3cbe0; --mute: #a9b3cc; --brown: #8d5c2c;
    --serif: "Fraunces", Georgia, serif; --sans: "Geist", system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { background: #000; }
  #stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; color: var(--cream); font-family: var(--sans);
    background:
      radial-gradient(70% 60% at 30% 25%, rgba(255,255,255,.05), transparent 70%),
      repeating-radial-gradient(circle at 20% 30%, rgba(0,0,0,.05) 0 2px, transparent 2px 5px),
      linear-gradient(160deg, var(--navy2), var(--navy)); }
  .beat { position: absolute; inset: 0; visibility: hidden; }
  .wm { position: absolute; font: italic 400 330px/0.9 var(--serif); letter-spacing: -.04em; color: rgba(233,197,70,.065); white-space: nowrap; pointer-events: none; }
  .brand { position: absolute; right: 64px; top: 52px; display: flex; align-items: center; gap: 14px; font: 600 18px var(--sans); letter-spacing: .24em; text-transform: uppercase; color: var(--mute); z-index: 20; }
  .brand img { width: 46px; }

  .kick { font: 600 26px/1 var(--sans); letter-spacing: .26em; text-transform: uppercase; color: var(--gold); display: flex; align-items: center; gap: 18px; }
  .kick::before { content: ""; width: 56px; height: 2px; background: currentColor; }
  .name { margin-top: 30px; font: 400 124px/0.98 var(--serif); letter-spacing: -.02em; }
  .name em, .ln em, .big em { font-style: italic; color: var(--gold); }
  .sub { margin-top: 30px; font: 400 32px/1.4 var(--sans); color: var(--soft); }
  .sub2 { margin-top: 12px; font: 500 26px/1.4 var(--sans); color: var(--gold); letter-spacing: .02em; }
  .ln { font: 400 76px/1.04 var(--serif); letter-spacing: -.02em; }
  .items { margin-top: 34px; }
  .items p { padding: 16px 0; border-top: 1px solid rgba(246,241,230,.16); font: 400 25px/1.35 var(--sans); color: var(--mute); }
  .items p b { display: block; font: 400 34px/1.15 var(--serif); color: var(--cream); margin-bottom: 4px; }
  .items p i { display: block; margin-top: 8px; font: italic 400 23px/1.4 var(--serif); color: var(--soft); max-width: 740px; }
  .items.dense p { padding: 12px 0; }
  .items.dense p b { font-size: 30px; }
  .items.dense p i { font-size: 21px; margin-top: 5px; }
  .bio { margin-top: 44px; padding-top: 26px; border-top: 1px solid rgba(233,197,70,.35); max-width: 700px; font: italic 400 32px/1.45 var(--serif); color: var(--soft); }
  .desc { margin-top: 30px; padding-top: 24px; border-top: 1px solid rgba(233,197,70,.35); max-width: 760px; font: italic 400 30px/1.45 var(--serif); color: var(--soft); }
  .flag { font: 600 30px/1 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  .big { margin-top: 26px; font: 400 104px/1 var(--serif); letter-spacing: -.02em; }
  .detail { margin-top: 26px; font: 400 30px/1.45 var(--sans); color: var(--soft); }

  .print { position: absolute; background: var(--cream); padding: 16px 16px 66px; box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 2px 6px rgba(0,0,0,.35); }
  .print .ph { overflow: hidden; background: #1d2b55; }
  .print img { display: block; width: 100%; height: 100%; object-fit: cover; will-change: transform; }
  .print .cap { position: absolute; left: 20px; right: 20px; bottom: 16px; font: italic 400 30px/1 var(--serif); color: var(--navy); white-space: nowrap; overflow: hidden; }
  .clip { position: absolute; background: #fff; padding: 8px; box-shadow: 0 30px 60px rgba(0,0,0,.55); }
  .clip img { display: block; }

  /* opening & closing */
  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .center .kick { justify-content: center; }
  .center .kick::after { content: ""; width: 56px; height: 2px; background: currentColor; }
  .hero { margin-top: 34px; font: 400 150px/0.95 var(--serif); letter-spacing: -.03em; }
  .hero em { font-style: italic; color: var(--gold); }
  .rule { width: 0; height: 2px; background: var(--gold); margin: 40px auto 0; }
</style>
</head>
<body>

<script>
const M = '../media/work/';
const LOGO = '../assets/logos/lambang-unikal.png';

/* ======================== DATA (semua teks layar di sini) ======================== */
const SCENES = [
  { type: 'open', dur: 20 },

  // RAISA · MODERATOR (45 dtk)
  { type: 'card', dur: 18, wm: 'Moderator', kick: 'The Moderator', name: 'Raisa <em>Alatas</em>',
    sub: 'Management Student, Universitas Pekalongan',
    bio: 'Passionate about business development, communication, and organizational leadership.',
    photo: { src: 'raisa/pro_close.jpg', w: 520, h: 700, cap: 'Raisa, 2026', pos: '50% 50%' } },
  { type: 'highlight', dur: 27, wm: 'Purpose', ln: '<em>Leading</em> with purpose.',
    items: [['Best Academic Performance', 'Academic Year 2025/2026', 'Awarded for the highest GPA of the academic year.'],
            ['International Collaborative Project', 'Kalasin University, Thailand', 'Exchanged perspectives on Indonesian and Thai communication styles.'],
            ['Head of Clothing Division', 'Rooang Karya', 'Led the division from planning to execution of its programs.'],
            ['Community Service Project', 'Smoked Fish MSMEs, 2026', 'Supported brand identity, packaging design, and marketing.']],
    photos: [
      { src: 'raisa/act1.jpg', w: 540, h: 340, cap: 'Universitas Pekalongan', x: 990, y: 110, r: -2.5, pos: '30% 85%' },
      { src: 'raisa/act2.jpg', w: 500, h: 375, cap: 'Studium Generale', x: 1290, y: 600, r: 2, pos: '50% 50%' },
      { src: 'raisa/outreach.jpg', w: 250, h: 444, cap: 'Outreach', x: 1610, y: 135, r: 3, pos: '50% 62%' } ] },

  // LUCY · SPEAKER 01 (70 dtk)
  { type: 'card', dur: 18, wm: 'Speaker', kick: 'Speaker 01', name: 'Luciana <em>Lelihoo</em><br>Madeira',
    sub: 'International Student from Timor Leste', sub2: 'Management, Class of 2025',
    bio: 'Experienced in project administration, documentation, and team coordination.',
    photo: { src: 'lucy/pro_close.jpg', w: 560, h: 700, cap: 'Lucy, Dili to Pekalongan', pos: '50% 50%' } },
  { type: 'highlight', dur: 27, wm: 'Cultures', ln: '<em>Bridging</em> cultures.',
    items: [['International Student Community Engagement', '2025', 'Environmental care, village based creative economy, and local culture for international students.'],
            ['The Untold Stories of International Students', 'Beyond Borders 2026', 'Represented Timor Leste and shared cross cultural experiences with students from many nations.'],
            ['Creative Writers Community of Timor Leste', 'KPKERS TL', 'Supported project planning, documentation, and community literacy programs.']],
    photos: [
      { src: 'lucy/bb3.jpg', w: 600, h: 338, cap: 'Beyond Borders 2026', x: 990, y: 110, r: -2, pos: '50% 50%' },
      { src: 'lucy/ise2.jpg', w: 540, h: 360, cap: 'Community Engagement 2025', x: 1300, y: 500, r: 2.5, pos: '50% 50%' },
      { src: 'lucy/bb2.jpg', w: 240, h: 426, cap: 'Sharing', x: 1630, y: 80, r: 3, pos: '50% 50%' },
      { src: 'lucy/ise3.jpg', w: 280, h: 373, cap: 'By the river', x: 1000, y: 560, r: -3, pos: '50% 50%' } ] },
  { type: 'achieve', dur: 25, wm: 'Champion', flag: 'First Place', big: 'Indonesian <em>Poetry</em> Reading',
    detail: 'BIPA Competition toward Festival Handai Indonesia 2026<br>Representing Universitas Pekalongan',
    desc: 'Top honors in a competition for international learners of the Indonesian language.',
    main: { src: 'lucy/loose2.jpg', w: 760, h: 570, cap: 'The award', x: 1040, y: 150, r: -1.5, pos: '45% 45%' },
    clip: { src: 'lucy/loose1.jpg', w: 300, h: 375, x: 1560, y: 600, r: 3 } },

  // ERICK · SPEAKER 02 (70 dtk)
  { type: 'card', dur: 18, wm: 'Speaker', kick: 'Speaker 02', name: 'Erick <em>Kurniawan</em><br>Syah',
    sub: 'Management Student, Universitas Pekalongan',
    bio: 'An aspiring entrepreneur who believes success means creating value for others.',
    photo: { src: 'erick/pro_close.jpg', w: 520, h: 700, cap: 'Erick, 2026', pos: '50% 50%' } },
  { type: 'highlight', dur: 27, wm: 'Ventures', ln: '<em>Building</em> ideas into ventures.',
    items: [['Student Innovative', 'Business Plan Participant, 2024', 'Pitched a business idea in front of potential investors.'],
            ['Innovation Festival (InnovFest)', 'Universiti Brunei Darussalam, Participant', 'A festival of creativity, innovation, and entrepreneurship connecting students, academics, and the community.']],
    photos: [
      { src: 'erick/act4.jpg', w: 330, h: 440, cap: 'In class', x: 1000, y: 110, r: -2.5, pos: '50% 50%' },
      { src: 'erick/act5.jpg', w: 330, h: 440, cap: 'Cultural day', x: 1390, y: 150, r: 2, pos: '50% 40%' },
      { src: 'erick/act2.jpg', w: 500, h: 375, cap: 'New friends', x: 1150, y: 600, r: -1.5, pos: '50% 50%' } ] },
  { type: 'achieve', dur: 25, wm: 'Brunei', flag: 'Student Exchange', big: 'Universiti <em>Brunei</em><br>Darussalam',
    detail: '2026',
    desc: 'Studied abroad to gain new perspectives, networks, and a different academic culture.',
    main: { src: 'erick/act3.jpg', w: 760, h: 570, cap: 'Brunei Darussalam, 2026', x: 1040, y: 130, r: -1.5, pos: '50% 50%' },
    clip: { src: 'erick/act7.jpg', w: 360, h: 270, x: 1500, y: 700, r: 3, print: true, cap: 'Certificate' } },

  // LAELA · SPEAKER 03 (70 dtk)
  { type: 'card', dur: 18, wm: 'Speaker', kick: 'Speaker 03', name: 'Laela <em>Nur</em><br>Fahmi',
    sub: 'Management Student, Universitas Pekalongan', sub2: 'Class Representative, International Class',
    bio: 'Active in and beyond the classroom, growing through leadership and teamwork.',
    photo: { src: 'laela/pro_close.jpg', w: 520, h: 700, cap: 'Laela, 2026', pos: '50% 50%' } },
  { type: 'highlight', dur: 27, wm: 'Impact', ln: '<em>Solving</em> problems that matter.',
    items: [['Group Leader, Community Outreach Program 2025', 'with students from Universiti Brunei Darussalam', 'Led one of three groups in a joint community program.'],
            ['Head of Human Resources Development', 'GenBI Komisariat Universitas Pekalongan', 'Leads programs for member skills, self development, and team building.'],
            ['Bank Indonesia Education Assistance Program', '2026', 'Selected recipient of the central bank education program.'],
            ['Funded Student Entrepreneur, P2MW 2026', 'KMI Expo 2026', 'Secured national funding for a student business and exhibited it.']],
    photos: [
      { src: 'laela/etc5.jpg', w: 500, h: 375, cap: 'COP 2025', x: 990, y: 100, r: -2, pos: '50% 50%' },
      { src: 'laela/p2mw4.jpg', w: 500, h: 375, cap: 'KMI Expo 2026', x: 1290, y: 590, r: 2, pos: '50% 50%' },
      { src: 'laela/p2mw13.jpg', w: 260, h: 320, cap: 'P2MW 2026', x: 1590, y: 80, r: 3, pos: '50% 50%' } ] },
  // Sumber: poster resmi FEB (Juara I Categories Best Idea, IBPC 2, MILA University Malaysia), prestasi tim.
  { type: 'achieve', dur: 25, wm: 'Malaysia', flag: 'First Place', big: 'Best <em>Idea</em> Category',
    detail: 'International Business Plan Competition 2<br>MILA University, Malaysia',
    desc: 'Won as a team with the business idea Nonabog.',
    main: { src: 'laela/my6.jpg', w: 450, h: 600, cap: 'MILA University', x: 1060, y: 120, r: -2, pos: '50% 35%' },
    clip: { src: 'laela/my10.jpg', w: 330, h: 440, x: 1500, y: 470, r: 3, print: true, cap: 'Kuala Lumpur' } },

  { type: 'close', dur: 25 }
];

/* ======================== BUILD ======================== */
const stage = document.getElementById('stage');
const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };
function print(p, extra = {}) {
  const d = el('div', 'print'); const ph = el('div', 'ph');
  ph.style.width = p.w + 'px'; ph.style.height = p.h + 'px';
  const img = el('img'); img.src = M + p.src; if (p.pos) img.style.objectPosition = p.pos; ph.append(img); d.append(ph);
  if (p.cap) d.append(el('p', 'cap', p.cap));
  Object.assign(d.style, { left: (p.x ?? extra.x) + 'px', top: (p.y ?? extra.y) + 'px', transform: `rotate(${p.r ?? extra.r ?? 0}deg)` });
  return d;
}
function copyBlock(x, y, w, children) { const c = el('div', 'copy'); Object.assign(c.style, { position: 'absolute', left: x + 'px', top: y + 'px', width: w + 'px' }); children.forEach(ch => c.append(ch)); return c; }

const tl = gsap.timeline({ paused: true });
const brand = el('div', 'brand', `<img src="${LOGO}" alt="">International Class`); stage.append(brand);
let t = 0; const SLIDE_IN = 1.5, SLIDE_OUT = 1.3;
const cues = []; const cue = (time, sfx, gain = 1) => cues.push({ t: +time.toFixed(3), sfx, gain });
const marks = [];

SCENES.forEach((s, i) => {
  const b = el('div', 'beat'); stage.append(b); const T = t;
  const first = i === 0, last = i === SCENES.length - 1;
  marks.push({ i, type: s.type, start: T, dur: s.dur, label: (s.kick || s.flag || s.ln || s.type).replace(/<[^>]+>/g, '') });

  if (s.wm) { const w = el('p', 'wm', s.wm); w.style.left = '70px'; w.style.top = '760px'; b.append(w);
    tl.fromTo(w, { x: 120 }, { x: -120, duration: s.dur + 2, ease: 'none' }, T); }

  if (s.type === 'open') {
    const c = el('div', 'center');
    const logo = el('img'); logo.src = LOGO; logo.style.width = '190px';
    const k = el('p', 'kick', 'Universitas Pekalongan');
    const h = el('h1', 'hero', 'International <em>Class</em>');
    const sub = el('p', 'sub', 'Management Study Program');
    const r = el('div', 'rule');
    const meet = el('p', 'sub2', 'Meet our moderator and speakers'); meet.style.marginTop = '34px';
    c.append(logo, k, h, sub, r, meet); b.append(c);
    tl.set(b, { visibility: 'visible' }, T);
    cue(T + 0.6, 'shimmer', 0.8); cue(T + 2.6, 'swell', 0.7);
    tl.fromTo(logo, { opacity: 0, scale: .86, filter: 'blur(10px)' }, { opacity: 1, scale: 1, filter: 'blur(0px)', duration: 2.4, ease: 'expo.out' }, T + 0.6);
    tl.fromTo(logo, { y: 0 }, { y: -10, duration: 6, ease: 'sine.inOut', yoyo: true, repeat: 2 }, T + 3);
    [k, h, sub].forEach((e, j) => tl.fromTo(e, { opacity: 0, y: 24, filter: 'blur(8px)' }, { opacity: 1, y: 0, filter: 'blur(0px)', duration: 1.6, ease: 'power3.out' }, T + 2.6 + j * 0.9));
    tl.to(r, { width: 420, duration: 2.2, ease: 'power2.inOut' }, T + 5.6); cue(T + 5.6, 'whoosh_soft', 0.6);
    tl.fromTo(meet, { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 1.6, ease: 'power2.out' }, T + 7.2);
    tl.fromTo(brand, { opacity: 0 }, { opacity: 1, duration: 1.5 }, T + s.dur - 2);
  }

  if (s.type === 'card') {
    const p = print({ ...s.photo, x: 220, y: 150, r: -2.5 }); b.append(p);
    const kids = [el('p', 'kick', s.kick), el('h2', 'name', s.name), el('p', 'sub', s.sub)];
    if (s.sub2) kids.push(el('p', 'sub2', s.sub2));
    if (s.bio) kids.push(el('p', 'bio', s.bio));
    const c = copyBlock(900, s.sub2 ? 230 : 280, 900, kids); b.append(c);
    tl.fromTo(p, { opacity: 0, y: -90, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 1.6, ease: 'expo.out' }, T + 1.0);
    cue(T + 1.2, 'drop'); cue(T + 2.5, 'shimmer', 0.55);
    tl.fromTo(p.querySelector('img'), { scale: 1.14 }, { scale: 1, duration: s.dur, ease: 'sine.out' }, T);
    tl.to(p, { y: 16, duration: 4.5, ease: 'sine.inOut', yoyo: true, repeat: Math.floor((s.dur - 3) / 4.5) }, T + 2.8);
    kids.forEach((e, j) => tl.fromTo(e, { opacity: 0, filter: 'blur(8px)', y: 14 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 1.3, ease: 'power2.out' }, T + 1.8 + j * 0.7));
  }

  if (s.type === 'highlight') {
    const ps = s.photos.map(ph => print(ph)); ps.forEach(p => b.append(p));
    const items = el('div', 'items'); s.items.forEach(([h, d, x]) => items.append(el('p', null, `<b>${h}</b>${d}${x ? `<i>${x}</i>` : ''}`)));
    if (s.items.length > 3) items.classList.add('dense');
    const c = copyBlock(130, s.items.length > 3 ? 120 : 190, 780, [el('h3', 'ln', s.ln), items]); b.append(c);
    ps.forEach((p, j) => {
      tl.fromTo(p, { opacity: 0, y: -90, scale: 1.08 }, { opacity: 1, y: 0, scale: 1, duration: 1.5, ease: 'expo.out' }, T + 1.0 + j * 1.1);
      cue(T + 1.2 + j * 1.1, 'drop', 0.85);
      tl.fromTo(p.querySelector('img'), { scale: 1.12 }, { scale: 1, duration: s.dur, ease: 'sine.out' }, T);
      tl.to(p, { y: 14, duration: 5 + j * .4, ease: 'sine.inOut', yoyo: true, repeat: Math.floor((s.dur - 6) / 5) }, T + 3 + j * 1.1);
    });
    tl.fromTo(c.querySelector('.ln'), { opacity: 0, filter: 'blur(8px)', y: 14 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 1.5, ease: 'power2.out' }, T + 1.8);
    [...items.children].forEach((e, j) => cue(T + 3.6 + j * 1.4, 'tick', 0.9));
    [...items.children].forEach((e, j) => tl.fromTo(e, { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 1.2, ease: 'power2.out' }, T + 3.6 + j * 1.4));
  }

  if (s.type === 'achieve') {
    const m = print(s.main); b.append(m);
    let cl;
    if (s.clip.print) cl = print(s.clip);
    else { cl = el('div', 'clip'); const im = el('img'); im.src = M + s.clip.src; im.style.width = s.clip.w + 'px'; im.style.height = s.clip.h + 'px'; im.style.objectFit = 'cover'; cl.append(im);
      Object.assign(cl.style, { left: s.clip.x + 'px', top: s.clip.y + 'px', transform: `rotate(${s.clip.r}deg)` }); }
    b.append(cl);
    const kids = [el('p', 'flag', s.flag), el('h3', 'big', s.big), el('p', 'detail', s.detail)];
    if (s.desc) kids.push(el('p', 'desc', s.desc));
    const c = copyBlock(130, 300, 820, kids); b.append(c);
    cue(T + 1.0, 'shutter'); cue(T + 1.2, 'drop'); cue(T + 1.5, 'shimmer'); cue(T + 3.2, 'drop', 0.8);
    tl.fromTo(kids[0], { opacity: 0, letterSpacing: '0.8em' }, { opacity: 1, letterSpacing: '0.34em', duration: 2.2, ease: 'power3.out' }, T + 1.4);
    tl.fromTo(kids[1], { opacity: 0, filter: 'blur(10px)', y: 20 }, { opacity: 1, filter: 'blur(0px)', y: 0, duration: 1.6, ease: 'power2.out' }, T + 2.4);
    tl.fromTo(kids[2], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.4, ease: 'power2.out' }, T + 3.4);
    if (kids[3]) tl.fromTo(kids[3], { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 1.4, ease: 'power2.out' }, T + 4.6);
    tl.fromTo(m, { opacity: 0, y: -100, scale: 1.1 }, { opacity: 1, y: 0, scale: 1, duration: 1.7, ease: 'expo.out' }, T + 1.0);
    tl.fromTo(m.querySelector('img'), { scale: 1.16 }, { scale: 1, duration: s.dur, ease: 'sine.out' }, T);
    tl.fromTo(cl, { opacity: 0, y: -90, rotation: s.clip.r + 6 }, { opacity: 1, y: 0, rotation: s.clip.r, duration: 1.5, ease: 'expo.out' }, T + 3.0);
    tl.to([m, cl], { y: 14, duration: 5, ease: 'sine.inOut', yoyo: true, repeat: Math.floor((s.dur - 6) / 5), stagger: .5 }, T + 4.6);
  }

  if (s.type === 'close') {
    const pros = [['raisa/pro_close.jpg', '50% 30%'], ['lucy/pro_close.jpg', '50% 25%'], ['erick/pro_close.jpg', '50% 60%'], ['laela/pro_close.jpg', '50% 22%']];
    const caps = ['Raisa', 'Lucy', 'Erick', 'Laela'];
    const xs = [250, 640, 1030, 1420], rs = [-4, 2, -2, 3.5];
    const ps = pros.map(([src, pos], j) => print({ src, pos, w: 300, h: 380, cap: caps[j], x: xs[j], y: 130, r: rs[j] }));
    ps.forEach(p => b.append(p));
    const c1 = el('div', 'center'); c1.style.top = '720px'; c1.style.justifyContent = 'flex-start';
    const h = el('h2', 'hero', 'Learning <em>Without Borders</em>'); h.style.fontSize = '104px';
    c1.append(h); b.append(c1);
    // aba-aba moderator
    const c2 = el('div', 'center');
    const rp = print({ src: 'raisa/pro_close.jpg', pos: '50% 50%', w: 360, h: 470, cap: 'Raisa, 2026' }); Object.assign(rp.style, { position: 'relative', left: 'auto', top: 'auto' });
    const k2 = el('p', 'kick', 'Please welcome our moderator'); k2.style.marginTop = '56px';
    const n2 = el('h2', 'name', 'Raisa <em>Alatas</em>');
    c2.append(rp, k2, n2); b.append(c2);
    ps.forEach((p, j) => cue(T + 1.2 + j * 0.8, 'drop', 0.85)); cue(T + 4.8, 'swell', 0.8); cue(T + 11, 'whoosh_soft', 0.7); cue(T + 13.2, 'drop'); cue(T + 14.4, 'shimmer');

  if (!first) cue(T - 0.35, 'whoosh');
